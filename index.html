<title>La Roca CRM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#eef2f7;color:#2d3748;font-size:15px;min-height:100vh}
button,input,select,textarea{font-family:inherit;outline:none;border:none}
button{cursor:pointer}
:root{
  --bg:#eef2f7;--card:#ffffff;--border:#dde3ee;
  --t1:#2d3748;--t2:#718096;--t3:#a0aec0;
  --blue:#5b8dee;--blue2:#4a7dd4;--bluel:#ebf2ff;
  --green:#48bb78;--greenl:#f0fff4;
  --amber:#ed8936;--amberl:#fffaf0;
  --red:#fc8181;--redl:#fff5f5;
  --purple:#9f7aea;--purplel:#faf5ff;
  --teal:#38b2ac;--teall:#e6fffa;
  --r:10px;--rl:14px;
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow2:0 8px 24px rgba(0,0,0,.10);
}
.scr{display:none;min-height:100vh}.scr.on{display:flex}
#s-login{align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0fe 0%,#eef2f7 50%,#e8f8f0 100%)}
.lbox{background:var(--card);border-radius:20px;border:1px solid var(--border);padding:40px 32px;width:100%;max-width:340px;box-shadow:var(--shadow2)}
.llogo{text-align:center;margin-bottom:28px}
.llogo-ic{width:64px;height:64px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:28px;box-shadow:0 4px 12px rgba(91,141,238,.3)}
.llogo h1{font-size:20px;font-weight:700;color:var(--t1)}.llogo p{font-size:13px;color:var(--t2);margin-top:4px}
.pdots{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.pd{width:50px;height:56px;background:#f7f9fc;border:2px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;transition:all .15s}
.pd.on{border-color:var(--blue);background:var(--bluel);color:var(--blue)}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shk{animation:shk .35s}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.nb{height:56px;background:#f7f9fc;border:2px solid var(--border);border-radius:var(--r);font-size:22px;font-weight:600;color:var(--t1);transition:all .12s;-webkit-user-select:none;user-select:none}
.nb:active{transform:scale(.92);background:var(--bluel);border-color:var(--blue);color:var(--blue)}
.nb.sm{font-size:13px;color:var(--t2);font-weight:500}
.lerr{text-align:center;font-size:13px;color:var(--red);margin-top:10px;min-height:18px;font-weight:500}
#s-nombre{align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0fe,#eef2f7)}
.nbox{background:var(--card);border-radius:20px;border:1px solid var(--border);padding:40px 32px;width:100%;max-width:360px;box-shadow:var(--shadow2);text-align:center}
.nbox-av{width:64px;height:64px;border-radius:50%;background:var(--bluel);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;border:2px solid var(--blue)}
.fi{width:100%;padding:13px 16px;background:#f7f9fc;border:2px solid var(--border);border-radius:var(--r);font-size:15px;color:var(--t1);text-align:center;margin-top:16px;transition:border-color .15s}
.fi:focus{border-color:var(--blue);background:#fff;outline:none}
.btn-blue{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:var(--r);font-size:14px;font-weight:600;color:#fff;margin-top:14px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(91,141,238,.3)}
.btn-blue:active{transform:scale(.98)}
#s-app{flex-direction:row}
.sb{width:220px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .28s;box-shadow:var(--shadow)}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--t1)}
.sb-brand-ic{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sb-user{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--bluel);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue);flex-shrink:0;border:2px solid var(--blue)}
.sb-uname{font-size:13px;font-weight:600;color:var(--t1)}.sb-urole{font-size:11px;color:var(--t2)}
.sb-nav{flex:1;padding:10px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t2);transition:all .12s;margin-bottom:2px;-webkit-user-select:none;user-select:none;font-weight:500}
.ni:active,.ni:hover{background:#f0f4ff;color:var(--blue)}.ni.on{background:var(--bluel);color:var(--blue);font-weight:600}
.ni-ic{font-size:16px;width:20px;text-align:center}
.sb-foot{padding:12px 10px;border-top:1px solid var(--border)}
.btn-out{width:100%;padding:11px 12px;background:#fff5f5;border:1.5px solid #fed7d7;border-radius:var(--r);font-size:13px;color:#e53e3e;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:600;transition:all .12s}
.btn-out:active,.btn-out:hover{background:#e53e3e;color:#fff;border-color:#e53e3e}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.tb-ttl{font-size:16px;font-weight:700;flex:1;color:var(--t1)}
.tb-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--bluel);color:var(--blue)}
.hburg{display:none;width:40px;height:40px;background:#f7f9fc;border:1.5px solid var(--border);border-radius:var(--r);align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--t2)}
.pcontent{padding:24px;flex:1}
@media(max-width:700px){.sb{transform:translateX(-100%)}.sb.open{transform:translateX(0)}.sb-ov.open{display:block}.main{margin-left:0}.hburg{display:flex}.cards-grid{grid-template-columns:1fr!important}.ch2{grid-template-columns:1fr!important}.frow,.contact-row{grid-template-columns:1fr!important}}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:18px 20px;box-shadow:var(--shadow);transition:transform .15s}
.sc:hover{transform:translateY(-2px)}
.sc-ic{font-size:28px;margin-bottom:8px}.sc-l{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:6px}
.sc-v{font-size:28px;font-weight:700;color:var(--t1);line-height:1}.sc-sub{font-size:11px;color:var(--t3);margin-top:4px}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.ytab{padding:7px 16px;border-radius:24px;font-size:13px;font-weight:500;background:var(--card);border:1.5px solid var(--border);color:var(--t2);cursor:pointer;transition:all .12s;box-shadow:var(--shadow);-webkit-user-select:none;user-select:none}
.ytab:active,.ytab:hover{border-color:var(--blue);color:var(--blue);background:var(--bluel)}
.ytab.on{background:var(--bluel);border-color:var(--blue);color:var(--blue);font-weight:600}
.cfilter{padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;transition:all .12s;box-shadow:var(--shadow)}
.cfilter.on.ex{background:var(--greenl);color:#276749;border-color:#9ae6b4}
.cfilter.on.bu{background:var(--bluel);color:var(--blue2);border-color:#90cdf4}
.cfilter.on.re{background:var(--amberl);color:#c05621;border-color:#fbd38d}
.cfilter.on.ri{background:var(--redl);color:#c53030;border-color:#feb2b2}
.cfilter.on.all{background:#edf2f7;color:var(--t1);border-color:#cbd5e0}
.srch{flex:1;min-width:150px;max-width:260px;padding:9px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);color:var(--t1);font-size:13px;box-shadow:var(--shadow);transition:border-color .15s}
.srch:focus{border-color:var(--blue);outline:none}
.res-ct{font-size:12px;color:var(--t3);margin-left:auto}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ccard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)}
.ccard:active,.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:var(--blue)}
.ccard-top{height:4px}
.ccard-top.ex{background:var(--green)}.ccard-top.bu{background:var(--blue)}.ccard-top.re{background:var(--amber)}.ccard-top.ri{background:var(--red)}
.cc-head{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:12px}
.cc-av{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.av-ex{background:var(--greenl);color:#276749}.av-bu{background:var(--bluel);color:var(--blue2)}.av-re{background:var(--amberl);color:#c05621}.av-ri{background:var(--redl);color:#c53030}
.cc-info{flex:1;min-width:0}.cc-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1)}.cc-sub{font-size:11px;color:var(--t2);margin-top:3px}
.cat-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cb-ex{background:var(--greenl);color:#276749}.cb-bu{background:var(--bluel);color:var(--blue2)}.cb-re{background:var(--amberl);color:#c05621}.cb-ri{background:var(--redl);color:#c53030}
.cc-score{padding:0 16px 10px;display:flex;align-items:center;gap:10px}
.sbw{flex:1;height:6px;background:#edf2f7;border-radius:4px;overflow:hidden}
.sb-bar{height:100%;border-radius:4px}
.sb-ex{background:var(--green)}.sb-bu{background:var(--blue)}.sb-re{background:var(--amber)}.sb-ri{background:var(--red)}
.sn{font-size:12px;font-weight:700;min-width:28px;text-align:right}
.sn-ex{color:#276749}.sn-bu{color:var(--blue2)}.sn-re{color:#c05621}.sn-ri{color:#c53030}
.cc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border)}
.cs{padding:10px 12px;text-align:center;border-right:1px solid var(--border)}.cs:last-child{border-right:none}
.cs-v{font-size:15px;font-weight:700;color:var(--t1)}.cs-l{font-size:10px;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.cc-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.btn-call{flex:1;padding:10px 12px;background:var(--greenl);border:1.5px solid #9ae6b4;color:#276749;border-radius:var(--r);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:all .15s}
.btn-call:active{background:var(--green);color:#fff;border-color:var(--green)}
.btn-sm{padding:10px 12px;background:#f7f9fc;border:1.5px solid var(--border);color:var(--t2);border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s}.btn-sm:active{background:#edf2f7}
.mov{display:none;position:fixed;inset:0;background:rgba(30,40,60,.45);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mov.open{display:flex}
.modal{background:var(--card);border:1.5px solid var(--border);border-radius:20px;width:100%;max-width:560px;box-shadow:var(--shadow2);margin:auto}
.mh{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.mh-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mh-name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1)}
.mclose{width:34px;height:34px;background:#f7f9fc;border:1.5px solid var(--border);border-radius:10px;font-size:16px;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .12s}
.mclose:active{background:var(--redl);color:#c53030;border-color:#feb2b2}
.mbody{padding:22px;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.mfoot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.copy-bar{background:var(--bluel);border:1.5px solid #bee3f8;border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.copy-nm{font-size:13px;font-weight:600;color:var(--blue2);flex:1;word-break:break-all}
.btn-copy{padding:5px 12px;background:var(--blue);border-radius:8px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;border:none}
.contact-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cf-wr{display:flex;gap:8px;align-items:center}
.fi2{flex:1;padding:11px 13px;background:#f7f9fc;border:2px solid var(--border);border-radius:var(--r);color:var(--t1);font-size:13px;width:100%;transition:border-color .15s}.fi2:focus{border-color:var(--blue);background:#fff;outline:none}
.btn-dial{padding:10px 13px;background:var(--greenl);border:1.5px solid #9ae6b4;color:#276749;border-radius:var(--r);font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block;transition:all .12s}
.stl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--border)}
.ep{padding:7px 14px;border-radius:24px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#f7f9fc;color:var(--t2);-webkit-user-select:none;transition:all .12s}
.ep.on-urgente{background:#fff5f5;color:#c53030;border-color:#feb2b2}
.ep.on-llamado{background:var(--bluel);color:var(--blue2);border-color:#90cdf4}
.ep.on-interesado{background:var(--amberl);color:#c05621;border-color:#fbd38d}
.ep.on-seguimiento{background:var(--teall);color:#2c7a7b;border-color:#81e6d9}
.ep.on-visita{background:var(--purplel);color:#6b46c1;border-color:#d6bcfa}
.ep.on-pago{background:var(--greenl);color:#276749;border-color:#9ae6b4}
.ep.on-pendiente{background:#f7fafc;color:var(--t2);border-color:#e2e8f0}
.score-box{background:#f7f9fc;border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.sbd-row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px}.sbd-ic{width:18px;text-align:center;flex-shrink:0}.sbd-tx{flex:1;color:var(--t2);font-size:12px}
.sbd-pt{font-size:12px;font-weight:700}.sbd-pt.pos{color:#276749}.sbd-pt.neg{color:#c53030}.sbd-pt.neu{color:var(--t3)}
.pay-list{max-height:140px;overflow-y:auto;margin-bottom:16px}
.pay-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}.pay-row:last-child{border-bottom:none}
.pay-date{color:var(--t2);width:90px;flex-shrink:0}.pay-forma{color:var(--t3);flex:1;font-size:11px}.pay-amt{font-weight:600;color:#276749;margin-left:auto}
.call-log{max-height:150px;overflow-y:auto;margin-bottom:16px}
.cl-e{background:#f7f9fc;border:1.5px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:6px}
.cl-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}.cl-date{font-size:11px;color:var(--t2)}.cl-user{font-size:11px;color:var(--t3);margin-left:auto}
.cl-note{font-size:13px;line-height:1.45;color:var(--t1)}.cl-empty{font-size:13px;color:var(--t3);padding:8px 0}
.fg{margin-bottom:14px}.fl{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.fsel,.finp,.ftxt{width:100%;padding:11px 13px;background:#f7f9fc;border:2px solid var(--border);border-radius:var(--r);color:var(--t1);font-size:13px;transition:border-color .15s}
.fsel:focus,.finp:focus,.ftxt:focus{border-color:var(--blue);background:#fff;outline:none}.ftxt{resize:vertical;min-height:80px;font-family:inherit}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn-s{padding:11px 20px;background:#f7f9fc;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--t2);cursor:pointer;font-weight:500;transition:all .12s}.btn-s:active{background:#edf2f7}
.btn-danger{padding:9px 14px;background:#fff5f5;border:1.5px solid #fed7d7;border-radius:var(--r);font-size:12px;color:#c53030;cursor:pointer;font-weight:600;transition:all .12s}.btn-danger:active{background:#c53030;color:#fff}
.chart-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.chart-ttl{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--t1)}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-hdr{text-align:center;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;padding:8px 0}

.cal-day.hc{cursor:pointer}.cal-day.hc:active,.cal-day.hc:hover{border-color:var(--blue);background:var(--bluel);transform:scale(1.02)}

.cal-dn{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:3px}.cal-day.today .cal-dn{color:var(--blue)}

.cal-nav button{padding:8px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--t2);cursor:pointer;font-weight:500;transition:all .12s}.cal-nav button:active{background:var(--bluel);color:var(--blue);border-color:var(--blue)}.cal-nav h3{font-size:15px;font-weight:700;flex:1;text-align:center;color:var(--t1)}

function loadFromSB(){

  function fetchAll(table,query){
    var all=[];
    function fetchPage(offset){
      return sbF(table,'GET',null,query+'&limit=1000&offset='+offset).then(function(rows){

}).concat(lo);}
    if(ld.length){DB.newLeads=ld.map(function(l){return{id:l.id,nombre:l.nombre,telefono:l.telefono||'',fechaContacto:l.fecha_contacto||'',fuente:l.fuente||'',producto:l.producto||'',notas:l.notas||'',leadCol:l.lead_col||'nl',kbComments:l.kb_comments||[],createdBy:l.created_by||'',createdAt:l.created_at||''};});}

function score(c){
  var s=50,rsns=[],pays=c.payments||[],byM={};
  pays.forEach(function(p){if(!p.fecha)return;var pts=p.fecha.split('/');var k=pts.length===3?pts[2]+'-'+pts[1].padStart(2,'0'):p.fecha.slice(0,7);byM[k]=(byM[k]||0)+1;});
  var meses=Object.keys(byM).sort(),m2=Object.values(byM).filter(function(v){return v>=2;}).length,mAct=meses.length;
  if(m2>=3){s+=20;rsns.push({ic:'✅',tx:'Pagó 2+ veces/mes durante '+m2+' meses',pt:20});}else if(m2>=1){s+=10;rsns.push({ic:'✅',tx:'Pagó 2+ veces en '+m2+' mes(es)',pt:10});}else rsns.push({ic:'—',tx:'Solo pagos únicos',pt:0});
  var ant=parseFloat(c.antiguedad)||0,mEsp=Math.max(1,Math.round(ant)),cons=mAct/mEsp;

  var maxG=0;for(var i=1;i<meses.length;i++){var a=meses[i-1].split('-'),b=meses[i].split('-');var diff=(parseInt(b[0])-parseInt(a[0]))*12+(parseInt(b[1]||0)-parseInt(a[1]||0))-1;if(diff>maxG)maxG=diff;}
  if(maxG>=3){s-=20;rsns.push({ic:'❌',tx:'Brecha '+maxG+' meses',pt:-20});}else if(maxG===2){s-=10;rsns.push({ic:'⚠️',tx:'2 meses sin pago',pt:-10});}else if(maxG===0&&mAct>2){s+=5;rsns.push({ic:'✅',tx:'Sin interrupciones',pt:5});}
  if(ant>=24){s+=15;rsns.push({ic:'✅',tx:Math.round(ant)+'m empresa',pt:15});}else if(ant>=12){s+=8;rsns.push({ic:'✅',tx:Math.round(ant)+'m antigüedad',pt:8});}else if(ant<3){s-=5;rsns.push({ic:'⚠️',tx:'Cliente reciente',pt:-5});}
  var mt=c.montoTotal||0;if(mt>50000){s+=10;rsns.push({ic:'✅',tx:'L '+mt.toLocaleString()+' pagados',pt:10});}else if(mt>20000){s+=5;rsns.push({ic:'✅',tx:'L '+mt.toLocaleString()+' pagados',pt:5});}
  var n=pays.length;if(n>=10){s+=5;rsns.push({ic:'✅',tx:n+' pagos',pt:5});}else if(n<=2){s-=10;rsns.push({ic:'⚠️',tx:'Muy pocos pagos',pt:-10});}
  if(c.ultimoPago){var pts2=c.ultimoPago.split('/');var d2=pts2.length===3?new Date(pts2[2],parseInt(pts2[1])-1,parseInt(pts2[0])):new Date(c.ultimoPago);if(!isNaN(d2)){var dias=Math.round((Date.now()-d2.getTime())/86400000);if(dias>90){s-=15;rsns.push({ic:'❌',tx:'Sin pagar '+dias+' días',pt:-15});}else if(dias>60){s-=8;rsns.push({ic:'⚠️',tx:'Sin pagar '+dias+' días',pt:-8});}else if(dias<=30){s+=5;rsns.push({ic:'✅',tx:'Pagó este mes',pt:5});}}}
  s=Math.max(0,Math.min(100,s));var cat='ri',lbl='Riesgoso',ic='🔴';
  if(s>=80){cat='ex';lbl='Excelente';ic='⭐';}else if(s>=60){cat='bu';lbl='Bueno';ic='👍';}else if(s>=40){cat='re';lbl='Regular';ic='⚠️';}
  return{s:s,cat:cat,lbl:lbl,ic:ic,rsns:rsns};
}

function buildCartPills(cur,fn,pid){var h='<div class="filter-row" id="'+(pid||'cp-'+fn)+'"><div class="ytab '+(cur===null?'on':'')+'" onclick="'+fn+'(null,this)">Todas</div>';DB.carteras.forEach(function(c){h+='<div class="ytab '+(cur===c.id?'on':'')+'" data-cid="'+c.id+'" onclick="'+fn+'(this.dataset.cid,this)">'+c.name+'</div>';});return h+'</div>';}
function buildVendPills(cur,fn,pid,cid){
  // All users + names from calls, normalized
  var vendUsers=DB.users.filter(function(u){return u.role==='vendedor'||u.role==='subadmin';});
  var calls=cid?DB.calls.filter(function(c){return c.carteraId===cid;}):DB.calls;
  // Build map of normalized name -> display name + count
  var vendMap={};
  vendUsers.forEach(function(u){
    if(!u.name)return;
    var key=u.name.trim().toLowerCase();
    if(!vendMap[key])vendMap[key]={display:u.name.trim(),count:0};
  });
  calls.forEach(function(c){
    var raw=c.userName||c.userId||'';
    var key=raw.trim().toLowerCase();
    if(!key)return;
    if(!vendMap[key])vendMap[key]={display:raw.trim(),count:0};
    vendMap[key].count++;
  });
  var allVends=Object.values(vendMap).sort(function(a,b){return a.display.localeCompare(b.display);});
  if(!allVends.length)return '';
  var curNorm=cur?(cur.trim().toLowerCase()):null;
  var h='<div class="filter-row" id="'+(pid||'vp-'+fn)+'">';
  h+='<div class="ytab '+(cur===null?'on':'')+'" onclick="'+fn+'(null,this)">👥 Todos</div>';
  allVends.forEach(function(v){
    var isActive=curNorm&&v.display.trim().toLowerCase()===curNorm;
    h+='<div class="ytab '+(isActive?'on':'')+'" data-vend="'+v.display+'" onclick="'+fn+'(this.dataset.vend,this)">👤 '+v.display+(v.count>0?' ('+v.count+')':'')+'</div>';
  });
  return h+'</div>';
}

function getKbStats(cid,vend){
  var cids=cid?[cid]:(CU.role==='vendedor'?[CU.cartera]:DB.carteras.map(function(x){return x.id;}));
  var allC=cids.flatMap(function(id){return(DB.clients[id]||[]).map(function(c){return Object.assign({},c,{_cid:id});});});
  var managed;
  if(vend){managed=new Set(DB.calls.filter(function(c){return cids.includes(c.carteraId)&&(c.userName||c.userId)===vend;}).map(function(c){return c.clientId;}));}
  else{managed=new Set(DB.calls.filter(function(c){return cids.includes(c.carteraId);}).map(function(c){return c.clientId;}));}
  var rs={};KB.recompra.cols.forEach(function(c){rs[c.id]=0;});
  allC.filter(function(c){return managed.has(c.id)||(c.kbCol&&c.kbCol!=='prospecto');}).forEach(function(c){var col=c.kbCol||'prospecto';if(rs[col]!==undefined)rs[col]++;else rs['prospecto']++;});
  var leads=DB.newLeads||[];if(vend)leads=leads.filter(function(l){return l.createdBy===vend;});
  var ls={};KB.nuevos.cols.forEach(function(c){ls[c.id]=0;});
  leads.forEach(function(l){var col=l.leadCol||'nl';if(ls[col]!==undefined)ls[col]++;else ls['nl']++;});
  return{recompra:rs,nuevos:ls};
}

    cids=[];colField='leadCol';defCol='nl';
  } else {
    cids=kbActiveCart?[kbActiveCart]:(CU.role==='vendedor'?getCarterasVend():DB.carteras.map(function(x){return x.id;}));

      if(!cids.includes(c.carteraId))return false;

function exportKbExcel(){

  } else {
    var cids=kbActiveCart?[kbActiveCart]:DB.carteras.map(function(x){return x.id;});
    var managed=new Set(DB.calls.map(function(c){return c.clientId;}));

        var col=board.cols.find(function(x){return x.id===(c.kbCol||'prospecto');})||{name:'Prospecto'};
        var lastCom=(c.kbComments||[]).slice(-1)[0];
        var cc=DB.calls.filter(function(x){return x.clientId===c.id;});

        var comentario=lastCom?(lastCom.fecha+' '+lastCom.autor+': '+lastCom.texto):(lastCall?(lastCall.date+' '+lastCall.resultado.replace(/-/g,' ')+(lastCall.notas?' - '+lastCall.notas:'')):'');

}

  h+='<div class="chart-card"><div class="chart-ttl">👥 Usuarios y accesos</div><div style="overflow-x:auto;"><table class="utbl"><thead><tr><th>Nombre</th><th>Rol</th><th>Cartera asignada</th><th>PIN</th><th>Gestiones</th><th></th></tr></thead><tbody>';
  sellers.forEach(function(u){var cart=DB.carteras.find(function(c){return c.id===u.cartera;});var rolCfg={admin:{lbl:'Admin',bg:'var(--bluel)',c:'var(--blue2)'},subadmin:{lbl:'Gerente',bg:'var(--amberl)',c:'#c05621'},vendedor:{lbl:'Vendedor',bg:'var(--greenl)',c:'#276749'}};var rc=rolCfg[u.role]||{lbl:u.role,bg:'#edf2f7',c:'var(--t2)'};h+='<tr><td><strong style="font-size:14px;">'+u.name+'</strong></td><td><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:'+rc.bg+';color:'+rc.c+';">'+rc.lbl+'</span></td><td style="color:var(--t2);font-size:13px;">'+(Array.isArray(u.cartera)&&u.cartera.length?u.cartera.map(function(id){var c=DB.carteras.find(function(x){return x.id===id;});return c?c.name:id;}).join(', '):(u.cartera?u.cartera:'Todas'))+'</td><td><span style="font-family:monospace;font-size:16px;font-weight:700;color:var(--amber);letter-spacing:3px;">'+u.pin+'</span></td><td style="color:var(--t2);">'+DB.calls.filter(function(c){return c.userId===u.id;}).length+'</td><td><button class="btn-sm" style="font-size:11px;padding:5px 10px;" data-uid="'+u.id+'" onclick="delUsr(this.dataset.uid)">Eliminar</button></td></tr>';});
  h+='</tbody></table></div></div></div>';return h;
}
function delCart(btn){var cid=btn.dataset.cid,cname=btn.dataset.cname;var cc=(DB.clients[cid]||[]).length;if(!confirm('¿Borrar la cartera "'+cname+'"?'+(cc>0?'\n\nTiene '+cc+' clientes. Se borrarán todos sus datos.':'')))return;delete DB.clients[cid];DB.carteras=DB.carteras.filter(function(c){return c.id!==cid;});DB.calls=DB.calls.filter(function(c){return c.carteraId!==cid;});DB.users.forEach(function(u){if(u.cartera===cid)u.cartera=null;});saveDB();sbDel('clientes','?cartera_id=eq.'+cid);sbDel('gestiones','?cartera_id=eq.'+cid);goTo('equipo');toast('Cartera "'+cname+'" eliminada','ok');}
function addCart(){var nm=prompt('Nombre de la nueva cartera:');if(!nm||!nm.trim())return;var id=prompt('ID interno (solo letras y números, sin espacios):');if(!id||!id.trim())return;var cleanId=id.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(DB.carteras.find(function(c){return c.id===cleanId;})){toast('Ese ID ya existe','err');return;}DB.carteras.push({id:cleanId,name:nm.trim()});saveDB();goTo('equipo');toast('Cartera "'+nm.trim()+'" creada ✓','ok');}
function openMovUsr(){openMov('mov-usr');initUF();}
function initUF(){
  var cc=document.getElementById('nu-cart-checks');
  if(cc){
    cc.innerHTML=DB.carteras.map(function(c){
      return '<label style="display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px;background:var(--card);"><input type="checkbox" value="'+c.id+'" style="width:16px;height:16px;cursor:pointer;accent-color:var(--blue);"> '+c.name+'</label>';
    }).join('');
  }
  document.getElementById('nu-nm').value='';
  document.getElementById('nu-pin').value='';
}
function saveUsr(){var name=document.getElementById('nu-nm').value.trim(),rol=document.getElementById('nu-rol').value,pin=document.getElementById('nu-pin').value.trim();
  var cartChecks=document.querySelectorAll('#nu-cart-checks input[type=checkbox]:checked');
  var cart=Array.from(cartChecks).map(function(cb){return cb.value;});
  if(cart.length===0)cart=[];if(!name||!pin){toast('Completa nombre y PIN','err');return;}if(!/^\d{4}$/.test(pin)){toast('El PIN debe ser exactamente 4 dígitos','err');return;}if(DB.users.find(function(u){return u.pin===pin;})){toast('Ese PIN ya está en uso — elige otro','err');return;}if(DB.users.find(function(u){return u.name.toLowerCase()===name.toLowerCase()&&u.role===rol;})){if(!confirm('Ya existe un usuario llamado "'+name+'" con el mismo rol. ¿Crear de todas formas?'))return;}var newU={id:'u'+Date.now(),name:name,pin:pin,role:rol,cartera:cart};DB.users.push(newU);var sbU=Object.assign({},newU,{cartera:JSON.stringify(newU.cartera)});saveDB();sbUp('usuarios',sbU);closeMov('mov-usr');goTo('equipo');toast('Usuario creado — PIN: '+pin,'ok');}
function delUsr(uid){
  var u=DB.users.find(function(x){return x.id===uid;});
  var calls=DB.calls.filter(function(c){return c.userId===uid;}).length;
  var msg=u?'¿Eliminar a "'+u.name+'"?'+(calls>0?' Tiene '+calls+' gestiones registradas.':''):'¿Eliminar?';
  if(!confirm(msg))return;
  DB.users=DB.users.filter(function(u){return u.id!==uid;});
  saveDB();goTo('equipo');toast('Usuario eliminado','ok');
}
function delUsersNoGest(){
  var sinGest=DB.users.filter(function(u){
    if(u.role==='admin')return false;
    return DB.calls.filter(function(c){return c.userId===u.id||c.userName===u.name;}).length===0;
  });
  if(!sinGest.length){toast('Todos los usuarios tienen gestiones','ok');return;}
  var names=sinGest.map(function(u){return u.name+' (PIN:'+u.pin+')'}).join('\n');
  if(!confirm('Eliminar '+sinGest.length+' usuarios sin gestiones:\n\n'+names))return;
  var ids=new Set(sinGest.map(function(u){return u.id;}));
  DB.users=DB.users.filter(function(u){return!ids.has(u.id);});
  saveDB();goTo('equipo');toast(sinGest.length+' usuarios eliminados','ok');
}

setInterval(function(){
  if(!CU)return;
  var kbModal=document.getElementById('kb-modal-overlay');
  var anyModal=document.querySelector('.mov.open');
  if(kbModal||anyModal)return;
  loadFromSB().then(function(){
    var ttl=document.getElementById('tb-ttl');if(!ttl)return;
    var view=ttl.textContent.toLowerCase();
    var map={dashboard:'dashboard',clientes:'clientes',kanban:'kanban',seguimiento:'seguimiento'};
    var cur=map[view];if(cur)goTo(cur);
  });
},10000);

window.addEventListener('DOMContentLoaded',initLogin);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
